<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wyltek Studio — Infographic Builder</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/nav.css" />
  <script src="/static/js/nav.js"></script>
  <style>
    .infographic-page {
      display: grid;
      grid-template-columns: 320px 1fr 240px;
      gap: 16px;
      padding: 16px;
      min-height: calc(100vh - 60px);
    }
    @media (max-width: 1100px) {
      .infographic-page { grid-template-columns: 1fr; }
    }
    .template-pane, .preview-pane, .history-pane {
      background: var(--card-bg, #1a1a1a);
      border: 1px solid var(--border, #333);
      border-radius: 12px;
      padding: 16px;
    }
    .template-pane label { display: block; margin-bottom: 12px; font-size: 13px; }
    .template-pane select, .template-pane input, .template-pane textarea {
      width: 100%;
      padding: 6px 8px;
      background: var(--input-bg, #0d0d0d);
      border: 1px solid var(--border, #333);
      color: var(--text, #eee);
      border-radius: 6px;
    }
    .template-pane fieldset.list-slot {
      border: 1px solid var(--border, #333);
      border-radius: 8px;
      padding: 8px;
      margin: 8px 0;
    }
    .template-pane .list-item {
      border-top: 1px dashed var(--border, #333);
      padding: 6px 0;
      position: relative;
    }
    .template-pane .list-item:first-child { border-top: none; }
    .template-pane .remove-row {
      position: absolute; top: 6px; right: 0;
      background: transparent; border: none; color: var(--text-dim, #888);
      cursor: pointer; font-size: 16px;
    }
    .render-tier {
      border: 1px solid var(--border, #333);
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 12px;
    }
    .render-tier legend { padding: 0 6px; font-size: 12px; color: var(--text-dim, #888); }
    .render-tier label { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
    #render-btn {
      width: 100%; margin-top: 8px;
      padding: 10px; border-radius: 8px;
      background: var(--accent, #4a90e2); color: #fff;
      border: none; cursor: pointer; font-weight: 600;
    }
    #render-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #precheck-banner button {
      margin-top: 8px; padding: 6px 12px;
      background: var(--accent, #4a90e2); color: #fff;
      border: none; border-radius: 6px; cursor: pointer;
    }
    #precheck-banner ul { margin: 4px 0 0 0; padding-left: 20px; }
    #precheck-banner li { margin: 2px 0; }
    .image-ref {
      position: relative;
      width: 56px; height: 56px;
      border: 1px solid var(--border, #333); border-radius: 6px;
      overflow: hidden;
    }
    .image-ref img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .image-ref .ref-label {
      position: absolute; left: 0; bottom: 0; right: 0;
      background: rgba(0,0,0,0.6); color: #fff; font-size: 10px;
      text-align: center; padding: 1px 0;
    }
    .image-ref .remove {
      position: absolute; top: -4px; right: -4px;
      background: var(--accent, #4a90e2); color: #fff; border: none;
      width: 18px; height: 18px; border-radius: 50%; font-size: 12px;
      line-height: 18px; padding: 0; cursor: pointer;
    }
    #image-ref-add:disabled { opacity: 0.4; cursor: not-allowed; }
    .chip {
      font-size: 11px; padding: 2px 8px;
      background: var(--accent-dim, rgba(74,144,226,0.15));
      color: var(--accent, #4a90e2);
      border: 1px solid var(--accent, #4a90e2); border-radius: 999px;
      cursor: pointer;
    }
    .chip:hover { background: var(--accent, #4a90e2); color: #fff; }
    .preview-pane { display: flex; flex-direction: column; align-items: center; }
    #preview-status { color: var(--text-dim, #888); padding: 24px; text-align: center; }
    .canvas-btn {
      padding: 6px 12px; font-size: 12px;
      background: var(--card-bg, #1a1a1a); color: var(--text, #eee);
      border: 1px solid var(--border, #333); border-radius: 6px;
      cursor: pointer;
    }
    .canvas-btn:hover { border-color: var(--accent, #4a90e2); }
    .history-pane h3 { margin: 0 0 8px; font-size: 14px; }
    .history-pane ul { list-style: none; padding: 0; margin: 0; }
    .history-pane ul li { margin-bottom: 6px; }
    .history-item {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 6px;
      background: transparent; border: 1px solid var(--border, #333);
      border-radius: 6px; cursor: pointer;
      color: var(--text, #eee); font-size: 11px;
      text-align: left;
    }
    .history-item:hover { border-color: var(--accent, #4a90e2); }
    .history-item img {
      width: 40px; height: 40px; object-fit: cover;
      border-radius: 4px; flex-shrink: 0;
    }
    .history-item span {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="precheck-banner" class="warning" hidden style="margin: 16px 16px 0; padding: 12px 16px; background: rgba(255,165,0,0.1); border: 1px solid rgba(255,165,0,0.5); border-radius: 8px; color: var(--text, #eee);"></div>
  <main class="infographic-page">
    <aside class="template-pane" id="template-pane">
      <h2 style="margin-top:0">Infographic Builder</h2>
      <label>Template
        <select id="template-select" disabled><option>Loading…</option></select>
      </label>
      <img id="template-preview" alt="" hidden style="max-width: 100%; border-radius: 8px; margin: 6px 0 12px; border: 1px solid var(--border, #333);" />
      <form id="slot-form"></form>
      <section class="image-refs">
        <h4 style="margin: 12px 0 6px; font-size: 13px; color: var(--text-dim, #888);">Image references (optional, max 4)</h4>
        <ul id="image-ref-list" style="list-style:none; padding:0; margin:0; display:flex; flex-wrap:wrap; gap:6px;"></ul>
        <input type="file" id="image-ref-input" accept="image/png,image/jpeg,image/webp" hidden />
        <button type="button" id="image-ref-add" style="margin-top:6px; padding:6px 10px; background:transparent; border:1px dashed var(--border, #333); color:var(--text, #eee); border-radius:6px; cursor:pointer;">+ Add image</button>
      </section>
      <fieldset class="render-tier">
        <legend>Render</legend>
        <label><input type="radio" name="tier" value="draft" checked /> Draft (~73s)</label>
        <label><input type="radio" name="tier" value="final" /> Final (~5min)</label>
        <label>Aspect
          <select id="aspect-select">
            <option value="1:1">1:1 (square)</option>
            <option value="16:9">16:9</option>
            <option value="9:16">9:16</option>
            <option value="3:2">3:2</option>
            <option value="2:3">2:3</option>
            <option value="4:3">4:3</option>
            <option value="3:4">3:4</option>
            <option value="1:2">1:2</option>
            <option value="2:1">2:1</option>
            <option value="1:3">1:3</option>
            <option value="3:1">3:1</option>
          </select>
        </label>
        <button type="button" id="render-btn" disabled>Render</button>
      </fieldset>
    </aside>
    <section class="preview-pane">
      <div id="preview-status">Pick a template, fill it in, hit Render.</div>
      <div class="preview-wrap" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;">
        <canvas id="preview-canvas" hidden style="max-width: 100%; max-height: 75vh; border-radius: 8px; image-rendering: -webkit-optimize-contrast;"></canvas>
        <div id="canvas-tools" hidden style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button type="button" id="canvas-paste" class="canvas-btn">Paste image</button>
          <button type="button" id="canvas-delete" class="canvas-btn">Delete layer</button>
          <button type="button" id="canvas-save" class="canvas-btn">Save composite</button>
        </div>
      </div>
    </section>
    <aside class="history-pane" id="history-pane">
      <h3>Recent</h3>
      <ul id="history-list"></ul>
    </aside>
  </main>
  <script type="module" src="/static/studio/js/infographic.js"></script>
</body>
</html>
