<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wyltek Studio — Infographic Builder</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/nav.css" />
  <script src="/static/js/nav.js"></script>
  <style>
    /* Page skeleton */
    .v2-wrap { padding: 16px; max-width: 1400px; margin: 0 auto; }

    /* Worker bar — reused pattern from v1, lifted verbatim for layout parity */
    .worker-bar {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 10px 12px; margin: 0 0 12px;
      background: var(--card-bg, #1a1a1a);
      border: 1px solid var(--border, #333);
      border-radius: 10px;
      font-size: 12px; align-items: center;
    }
    .worker-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px;
      border: 1px solid var(--border, #333);
      background: rgba(255,255,255,0.03);
    }
    .worker-pill .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #888;
    }
    .worker-pill.state-running  .dot { background: #4ade80; }
    .worker-pill.state-starting .dot { background: #fbbf24; animation: blink 1s infinite; }
    .worker-pill.state-stopped  .dot { background: #6b7280; }
    .worker-pill.state-crashed  .dot { background: #ef4444; }
    .worker-pill.state-unknown  .dot { background: #a78bfa; }
    @keyframes blink { 50% { opacity: 0.3; } }
    .worker-btn {
      padding: 4px 10px; font-size: 11px;
      background: transparent; color: var(--text, #eee);
      border: 1px solid var(--border, #333); border-radius: 6px; cursor: pointer;
    }
    .worker-btn:hover { border-color: var(--accent, #4a90e2); }
    .worker-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .worker-btn.danger { color: #ffb3b3; border-color: rgba(220,80,80,0.5); }
    .worker-bar .spacer { flex: 1; }
    .worker-bar .vram { color: var(--text-dim, #888); font-variant-numeric: tabular-nums; }

    /* Filter chips */
    .filter-row {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
      align-items: center;
    }
    .filter-chip {
      padding: 6px 14px; border-radius: 999px; font-size: 13px;
      background: var(--card-bg, #1a1a1a);
      border: 1px solid var(--border, #333);
      color: var(--text-dim, #888); cursor: pointer;
      transition: border-color 0.1s, color 0.1s;
    }
    .filter-chip:hover { color: var(--text, #eee); border-color: var(--accent, #4a90e2); }
    .filter-chip.active {
      color: var(--text, #eee);
      border-color: var(--accent, #4a90e2);
      background: rgba(74, 144, 226, 0.12);
    }
    .filter-chip .count {
      font-size: 11px; color: var(--text-dim, #888);
      margin-left: 4px;
    }
    .corpus-hint {
      margin-left: auto; font-size: 11px; color: var(--text-dim, #888);
    }

    /* Gallery grid */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg, #1a1a1a);
      border: 1px solid var(--border, #333);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      display: flex; flex-direction: column;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent, #4a90e2);
    }
    .card .thumb-wrap {
      width: 100%; aspect-ratio: 1; overflow: hidden;
      background: #0a0a0a;
      display: flex; align-items: center; justify-content: center;
    }
    .card img.thumb {
      width: 100%; height: 100%; object-fit: cover;
      display: block;
    }
    .card .meta { padding: 10px 12px; }
    .card .title {
      font-size: 13px; font-weight: 600; color: var(--text, #eee);
      line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card .dims {
      margin-top: 4px; font-size: 11px; color: var(--text-dim, #888);
      font-variant-numeric: tabular-nums;
    }

    /* Editor view */
    .editor-wrap[hidden] { display: none; }
    .gallery-wrap[hidden] { display: none; }
    .editor {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 900px) { .editor { grid-template-columns: 1fr; } }
    .editor .pane {
      background: var(--card-bg, #1a1a1a);
      border: 1px solid var(--border, #333);
      border-radius: 12px; padding: 16px;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; margin-bottom: 12px; font-size: 13px;
      background: transparent; color: var(--text-dim, #888);
      border: 1px solid var(--border, #333); border-radius: 6px;
      cursor: pointer;
    }
    .back-link:hover { color: var(--text, #eee); border-color: var(--accent, #4a90e2); }
    .reference-img {
      width: 100%; border-radius: 8px; background: #0a0a0a;
      max-height: 60vh; object-fit: contain;
    }
    .reference-caption {
      margin-top: 8px; font-size: 12px; color: var(--text-dim, #888);
    }
    .prompt-area {
      width: 100%; min-height: 260px; resize: vertical;
      padding: 10px; font: 13px/1.5 ui-monospace, monospace;
      background: var(--input-bg, #0d0d0d);
      color: var(--text, #eee);
      border: 1px solid var(--border, #333); border-radius: 8px;
      box-sizing: border-box;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px; margin-top: 12px;
    }
    .controls label {
      display: flex; flex-direction: column; gap: 4px;
      font-size: 11px; color: var(--text-dim, #888);
    }
    .controls input, .controls select {
      padding: 6px 8px; font-size: 13px;
      background: var(--input-bg, #0d0d0d); color: var(--text, #eee);
      border: 1px solid var(--border, #333); border-radius: 6px;
    }
    .actions { display: flex; gap: 8px; margin-top: 14px; }
    .actions button {
      flex: 1; padding: 10px; border-radius: 8px;
      font-weight: 600; cursor: pointer; border: none;
    }
    #render-btn {
      background: var(--accent, #4a90e2); color: #fff;
    }
    #render-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #cancel-btn {
      flex: 0 0 auto; padding: 10px 16px;
      background: rgba(220, 80, 80, 0.18); color: #ffb3b3;
      border: 1px solid rgba(220, 80, 80, 0.55);
    }
    #cancel-btn[hidden] { display: none; }
    #render-status {
      margin-top: 10px; font-size: 12px; color: var(--text-dim, #888);
      min-height: 18px;
    }
    .progress-track {
      width: 100%; height: 4px; margin-top: 6px;
      background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: var(--accent, #4a90e2);
      width: 0%; transition: width 0.3s;
    }
    #output-preview {
      margin-top: 14px; width: 100%; border-radius: 8px;
      background: #0a0a0a; max-height: 60vh; object-fit: contain;
    }
    #output-preview[hidden] { display: none; }
    #output-actions { margin-top: 8px; display: flex; gap: 8px; }
    #output-actions[hidden] { display: none; }
    .small-btn {
      padding: 4px 10px; font-size: 11px;
      background: transparent; color: var(--text, #eee);
      border: 1px solid var(--border, #333); border-radius: 6px;
      cursor: pointer; text-decoration: none;
    }
  </style>
</head>
<body>
  <nav id="site-nav"></nav>

  <div class="v2-wrap">
    <!-- Worker lifecycle controls (reused from v1) -->
    <div class="worker-bar" id="worker-bar">
      <span class="worker-pill state-unknown" id="sense-pill">
        <span class="dot"></span><span class="label">SenseNova: …</span>
      </span>
      <button type="button" class="worker-btn" id="sense-start">Start worker</button>
      <button type="button" class="worker-btn" id="sense-restart">Restart</button>
      <button type="button" class="worker-btn danger" id="sense-stop">Stop</button>
      <span class="spacer"></span>
      <span class="vram" id="vram-readout"></span>
    </div>

    <!-- Gallery view (default) -->
    <div class="gallery-wrap" id="gallery-wrap">
      <div class="filter-row" id="filter-row">
        <!-- chips injected -->
        <span class="corpus-hint" id="corpus-hint"></span>
      </div>
      <div class="gallery" id="gallery"></div>
    </div>

    <!-- Editor view (shown after clicking a card) -->
    <div class="editor-wrap" id="editor-wrap" hidden>
      <button class="back-link" id="back-link" type="button">← Back to gallery</button>
      <div class="editor">
        <div class="pane">
          <img class="reference-img" id="reference-img" alt="reference" />
          <div class="reference-caption" id="reference-caption"></div>
        </div>
        <div class="pane">
          <textarea class="prompt-area" id="prompt-area"
            spellcheck="false"
            placeholder="Edit the prompt…"></textarea>
          <div class="controls">
            <label>Width
              <input type="number" id="width-input" min="512" max="2592" step="32" />
            </label>
            <label>Height
              <input type="number" id="height-input" min="512" max="2592" step="32" />
            </label>
            <label>Seed
              <input type="number" id="seed-input" min="0" value="42" />
            </label>
            <label>Steps
              <select id="steps-input">
                <option value="20">20 (preview)</option>
                <option value="50" selected>50 (final)</option>
              </select>
            </label>
          </div>
          <div class="actions">
            <button type="button" id="render-btn">Render</button>
            <button type="button" id="cancel-btn" hidden>Cancel</button>
          </div>
          <div id="render-status"></div>
          <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
          <img id="output-preview" hidden alt="output" />
          <div id="output-actions" hidden>
            <a id="download-link" class="small-btn" download>Download PNG</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/static/studio/js/infographic.js"></script>
</body>
</html>
